services:
  artisan-cloud-home:
    image: ${ARTISANCLOUD_HOME_IMAGE:?Initialize site configuration using scripts/hosting.sh}
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
