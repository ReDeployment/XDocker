name: Validate and Publish XDocker Admin
on:
  pull_request:
    branches: [main]
    paths:
      - services/admin/**
      - services/github-webhook/**
      - scripts/admin*.sh
      - scripts/admin*.py
      - scripts/preflight*
      - tests/**
      - apps/powerx/versions.json
      - .github/workflows/publish-admin.yml
  push:
    branches: [main]
    paths:
      - services/admin/**
      - services/github-webhook/**
      - scripts/admin*.sh
      - scripts/admin*.py
      - scripts/preflight*
      - tests/**
      - apps/powerx/versions.json
      - .github/workflows/publish-admin.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Serialize push and manual runs on the same ref, including publication.
  group: admin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: API and delivery regression tests
        run: |
          pip install -r services/admin/requirements.txt cryptography
          python -m unittest discover -s tests -p 'test_*.py'
          node --check services/admin/static/app.js
          node tests/admin_connection_ui.cjs
          sh -n scripts/admin.sh scripts/admin-tunnel.sh scripts/preflight.sh

  smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ADMIN_SMOKE_IMAGE: xdocker-admin-ci:sha-${{ github.sha }}-${{ matrix.arch }}
      ADMIN_SMOKE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install host test dependencies
        run: pip install -r services/admin/requirements.txt
      - uses: docker/setup-buildx-action@v4
      - name: Verify public build context with fake private fixtures
        run: python tests/admin_build_context_smoke.py
      - name: Build local candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: services/admin
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          build-args: REVISION=${{ github.sha }}
          tags: ${{ env.ADMIN_SMOKE_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/ReDeployment/XDocker
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=admin-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=admin-${{ matrix.arch }}
      - name: Real packaged HTTP and Docker lifecycle acceptance
        run: |
          python tests/admin_http_smoke.py
          python tests/admin_smoke.py
      - name: Real database backup, restore and scheduled admission
        run: python tests/backup_smoke.py
      - name: Export the tested image and receipt
        if: github.repository == 'ReDeployment/XDocker' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          python scripts/admin_image_artifact.py export --image "$ADMIN_SMOKE_IMAGE" --revision "$ADMIN_SMOKE_REVISION" --arch '${{ matrix.arch }}' --directory "$RUNNER_TEMP/admin-artifact"
      - uses: actions/upload-artifact@v6
        if: github.repository == 'ReDeployment/XDocker' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: admin-tested-${{ matrix.arch }}
          path: ${{ runner.temp }}/admin-artifact/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: smoke
    if: github.repository == 'ReDeployment/XDocker' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          pattern: admin-tested-*
          path: ${{ runner.temp }}/admin-artifact
          merge-multiple: true
      - name: Verify and load both tested images without rebuilding
        run: python scripts/admin_image_artifact.py load --revision "$GITHUB_SHA" --directory "$RUNNER_TEMP/admin-artifact"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish the tested platform images and assemble the index
        env:
          ADMIN_REGISTRY_IMAGE: ghcr.io/redeployment/xdocker-admin
        run: |
          for xdocker_arch in amd64 arm64; do
            docker tag "xdocker-admin-ci:sha-${GITHUB_SHA}-${xdocker_arch}" "${ADMIN_REGISTRY_IMAGE}:sha-${GITHUB_SHA}-${xdocker_arch}"
            docker push "${ADMIN_REGISTRY_IMAGE}:sha-${GITHUB_SHA}-${xdocker_arch}"
          done
          docker buildx imagetools create --tag "${ADMIN_REGISTRY_IMAGE}:sha-${GITHUB_SHA}" "${ADMIN_REGISTRY_IMAGE}:sha-${GITHUB_SHA}-amd64" "${ADMIN_REGISTRY_IMAGE}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect --raw "${ADMIN_REGISTRY_IMAGE}:sha-${GITHUB_SHA}" > "$RUNNER_TEMP/admin-index.json"
          python scripts/admin_image_artifact.py check-index --index "$RUNNER_TEMP/admin-index.json"
