name: Build and Publish XDocker Admin
on:
  push:
    branches: [main]
    paths:
      - services/admin/**
      - scripts/admin.sh
      - tests/test_admin.py
      - tests/admin_smoke.py
      - .github/workflows/publish-admin.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: API regression tests
        run: |
          pip install -r services/admin/requirements.txt
          pip install cryptography
          python -m unittest discover -s tests -p 'test_*.py'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: services/admin
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: REVISION=${{ github.sha }}
          tags: ghcr.io/redeployment/xdocker-admin:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ReDeployment/XDocker
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - name: Real Docker lifecycle smoke test
        env:
          ADMIN_SMOKE_IMAGE: ghcr.io/redeployment/xdocker-admin:sha-${{ github.sha }}
        run: |
          docker pull --platform linux/amd64 "$ADMIN_SMOKE_IMAGE"
          python tests/admin_smoke.py
