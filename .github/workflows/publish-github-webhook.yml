name: Validate and Publish GitHub Webhook Receiver
on:
  pull_request:
    branches: [main]
    paths: [services/github-webhook/**, services/admin/**, scripts/github-webhook.sh, scripts/hosting.sh, nginx/webhook-*, sites/github-webhook/**, tests/**, .github/workflows/publish-github-webhook.yml]
  push:
    branches: [main]
    paths: [services/github-webhook/**, services/admin/**, scripts/github-webhook.sh, scripts/hosting.sh, nginx/webhook-*, sites/github-webhook/**, tests/**, .github/workflows/publish-github-webhook.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-webhook-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          pip install -r services/admin/requirements.txt cryptography
          XDOCKER_TEST_NO_DOCKER=1 python -m unittest discover -s tests -p 'test_*.py'
          node --check services/admin/static/github.js
          node tests/admin_connection_ui.cjs
          sh -n scripts/github-webhook.sh scripts/hosting.sh
  smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOOK_SMOKE_IMAGE: xdocker-github-webhook-ci:sha-${{ github.sha }}-${{ matrix.arch }}
      HOOK_SMOKE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@v4
      - run: python tests/admin_build_context_smoke.py --receiver-only
      - uses: docker/build-push-action@v7
        with:
          context: services/github-webhook
          load: true
          push: false
          tags: ${{ env.HOOK_SMOKE_IMAGE }}
          build-args: REVISION=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ReDeployment/XDocker
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=github-webhook-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=github-webhook-${{ matrix.arch }}
      - run: python tests/github_webhook_smoke.py
      - name: Export the tested image
        run: |
          mkdir -p "$RUNNER_TEMP/hook-artifact"
          docker save "$HOOK_SMOKE_IMAGE" | gzip > "$RUNNER_TEMP/hook-artifact/image.tar.gz"
          cd "$RUNNER_TEMP/hook-artifact"
          sha256sum image.tar.gz > image.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: github-webhook-tested-${{ matrix.arch }}
          path: ${{ runner.temp }}/hook-artifact/*
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: github-webhook-tested-*
          path: ${{ runner.temp }}/hook-artifacts
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested bytes, without rebuilding
        env:
          HOOK_IMAGE: ghcr.io/redeployment/xdocker-github-webhook
        run: |
          set -euo pipefail
          for hook_arch in amd64 arm64; do
            cd "$RUNNER_TEMP/hook-artifacts/github-webhook-tested-$hook_arch"
            sha256sum -c image.sha256
            docker load -i image.tar.gz
            hook_source="xdocker-github-webhook-ci:sha-${GITHUB_SHA}-${hook_arch}"
            test "$(docker image inspect --format '{{.Architecture}}' "$hook_source")" = "$hook_arch"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$hook_source")" = "$GITHUB_SHA"
            docker tag "$hook_source" "${HOOK_IMAGE}:sha-${GITHUB_SHA}-${hook_arch}"
            docker push "${HOOK_IMAGE}:sha-${GITHUB_SHA}-${hook_arch}"
          done
          docker buildx imagetools create --tag "${HOOK_IMAGE}:sha-${GITHUB_SHA}" "${HOOK_IMAGE}:sha-${GITHUB_SHA}-amd64" "${HOOK_IMAGE}:sha-${GITHUB_SHA}-arm64"
