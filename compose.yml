name: xdocker-web-hosting

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    entrypoint: [/bin/sh, /opt/xdocker/nginx-entrypoint.sh]
    volumes:
      - ./nginx/nginx-entrypoint.sh:/opt/xdocker/nginx-entrypoint.sh:ro
      - ./data/nginx:/etc/nginx/conf.d:ro
      - ./data/acme:/var/www/certbot:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/events:/var/lib/certbot-events:ro

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    profiles: [tools]
    volumes:
      - ./data/acme:/var/www/certbot
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/events:/var/lib/certbot-events

  certbot-renew:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    entrypoint: [/bin/sh, /opt/xdocker/renew.sh]
    volumes:
      - ./certbot/renew.sh:/opt/xdocker/renew.sh:ro
      - ./data/acme:/var/www/certbot
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/events:/var/lib/certbot-events
