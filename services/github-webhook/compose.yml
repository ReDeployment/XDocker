services:
  github-webhook:
    image: ${GITHUB_WEBHOOK_IMAGE:?Configure services/github-webhook/.env}
    pull_policy: ${GITHUB_WEBHOOK_PULL_POLICY:-missing}
    user: "${GITHUB_WEBHOOK_UID:-1000}:${GITHUB_WEBHOOK_GID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes:
      - ./data/github-webhook/inbox:/inbox
      - ./data/github-webhook/secrets:/secrets:ro
    networks: [github-ingress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  nginx:
    networks:
      default: {}
      github-ingress: {}
networks:
  github-ingress:
    internal: true
