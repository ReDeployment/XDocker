services:
  portainer:
    image: ${PORTAINER_IMAGE:?Initialize services/portainer/.env}
    pull_policy: ${PORTAINER_PULL_POLICY:-missing}
    restart: unless-stopped
    command: ["--http-enabled", "--host", "unix:///var/run/docker.sock", "--log-mode", "NOCOLOR"]
    ports:
      - "127.0.0.1:${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks: [portainer-admin]

# The management API is not connected to the websites/FRPS network.
networks:
  portainer-admin:
